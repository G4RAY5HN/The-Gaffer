<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2d6a4f"/>
      <stop offset="0.55" stop-color="#1a5336"/>
      <stop offset="1" stop-color="#0f3a24"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0" stop-color="rgba(198,242,78,0.55)"/>
      <stop offset="1" stop-color="rgba(198,242,78,0)"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255,255,255,0.85)"/>
      <stop offset="1" stop-color="rgba(255,255,255,0.55)"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#tile)"/>
  <circle cx="150" cy="140" r="220" fill="url(#glow)"/>
  <g stroke="rgba(255,255,255,0.07)" stroke-width="5">
    <line x1="0" y1="180" x2="512" y2="180"/>
    <line x1="0" y1="330" x2="512" y2="330"/>
  </g>

  <!-- frosted glass ball -->
  <circle cx="256" cy="250" r="132" fill="url(#glass)" opacity="0.95"/>
  <circle cx="256" cy="250" r="132" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="3"/>

  <!-- minimalist ball pattern in turf green -->
  <g fill="#1a5336">
    <polygon points="256,196 290,221 277,262 235,262 222,221"/>
  </g>
  <g fill="none" stroke="#1a5336" stroke-width="7" stroke-linecap="round" opacity="0.65">
    <line x1="256" y1="196" x2="256" y2="168"/>
    <line x1="222" y1="221" x2="182" y2="210"/>
    <line x1="290" y1="221" x2="330" y2="210"/>
    <line x1="235" y1="262" x2="214" y2="300"/>
    <line x1="277" y1="262" x2="298" y2="300"/>
  </g>

  <!-- volt accent arc -->
  <path d="M 152 250 A 104 104 0 0 1 360 250" fill="none" stroke="#c6f24e" stroke-width="10" stroke-linecap="round" opacity="0.9"/>

  <!-- top shine on glass -->
  <ellipse cx="216" cy="212" rx="66" ry="34" fill="rgba(255,255,255,0.6)"/>

  <text x="256" y="446" font-family="-apple-system, Helvetica Neue, Arial, sans-serif" font-weight="800" font-size="62" fill="#ffffff" text-anchor="middle" letter-spacing="-2">GAFFER</text>
</svg>
